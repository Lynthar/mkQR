name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + tags so `git describe` sets VERSION correctly in the Makefile.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Cross-compile for all platforms
        run: make cross

      - name: Generate SHA256 checksums
        working-directory: build
        run: sha256sum mkqr-* > SHA256SUMS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            build/mkqr-linux-amd64 \
            build/mkqr-linux-arm64 \
            build/mkqr-darwin-amd64 \
            build/mkqr-darwin-arm64 \
            build/mkqr-windows-amd64.exe \
            build/SHA256SUMS
